---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workout-logger
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/vvojtisek/workout-logger.git
    targetRevision: main
    path: helm/workout-logger
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The production node has 2 GiB RAM (issue #72): only apply resources that
      # drifted, instead of re-applying every object against a starved API server.
      - ApplyOutOfSyncOnly=true
    # A sync that fails while the API server is timing out retries on its own with
    # growing delays, rather than staying failed until k3s is restarted by hand.
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
