# k3s drop-in for the 2 GiB production node (issue #72).
#
# Install as /etc/rancher/k3s/config.yaml.d/10-small-host.yaml, then restart k3s once
# (see deploy/k3s/README.md). The `+` suffix appends to any kubelet-arg already set in
# the host's own /etc/rancher/k3s/config.yaml instead of replacing it.
#
# Without reservations the scheduler hands the whole 2 GiB to pods, so Argo CD,
# cert-manager, Traefik and the application can consume the memory the k3s server
# process itself needs, and API requests then time out. These values keep a floor free
# for the control plane and make the kubelet evict pods before the node thrashes.
# They are a starting point sized from the 2026-08-23 incident (~1.7 GiB used, <200 MB
# available); re-measure with `kubectl top` / `free -m` after a rollout and adjust.
kubelet-arg+:
  - system-reserved=memory=256Mi
  - kube-reserved=memory=256Mi
  - eviction-hard=memory.available<200Mi
