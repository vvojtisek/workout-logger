---
replicaCount: 1

strategy:
  type: Recreate

image:
  repository: ghcr.io/vvojtisek/workout-logger
  tag: ""
  digest: "sha256:e25980a8d336975524a426ac43d9c54b42fcfcdf4a3d885a2ea564f6353b7628"
  sourceCommit: "e377e66df948d21cdfb269194aa9f1fe32960757"
  pullPolicy: IfNotPresent

existingSecret: workout-logger-secret
apiKeySecretKey: API_KEY

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: fitness.vvojtisek.eu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: workout-logger-tls
      hosts:
        - fitness.vvojtisek.eu

env:
  APP_ENV: production
  APP_VERSION: "2.0.0"
  LOG_LEVEL: INFO
  TRUSTED_HOSTS: "localhost,127.0.0.1,fitness.vvojtisek.eu"
  PUBLIC_BASE_URL: "https://fitness.vvojtisek.eu/"
  RUN_MIGRATIONS_ON_STARTUP: "false"

persistence:
  enabled: true
  size: 2Gi

backupPersistence:
  enabled: true
  size: 2Gi

backup:
  enabled: true
  schedule: "17 2 * * *"
  keep: 7

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
