---
replicaCount: 1

strategy:
  type: Recreate

image:
  repository: ghcr.io/vvojtisek/workout-logger
  tag: ""
  digest: "sha256:73d48e318d8fb5c3cf8882a544e3eb722d8691a0f91412b59a0c9edc86a03cc6"
  sourceCommit: "7cded1202083550ee17e1e366e0b7fad4fe8433e"
  pullPolicy: IfNotPresent

existingSecret: workout-logger-secret
apiKeySecretKey: API_KEY

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: fitness.vvojtisek.eu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: workout-logger-tls
      hosts:
        - fitness.vvojtisek.eu

env:
  APP_ENV: production
  # Kept in sync with image.digest/image.sourceCommit above by
  # scripts/promote_image.py on every production promotion -- never edit by hand.
  APP_VERSION: "2.0.0"
  GIT_COMMIT: "7cded1202083550ee17e1e366e0b7fad4fe8433e"
  BUILD_TIME: "2026-08-25T06:42:15Z"
  LOG_LEVEL: INFO
  TRUSTED_HOSTS: "localhost,127.0.0.1,fitness.vvojtisek.eu"
  PUBLIC_BASE_URL: "https://fitness.vvojtisek.eu/"
  RUN_MIGRATIONS_ON_STARTUP: "false"
  # MCP OAuth: disabled until the Auth0 application described in the README's
  # "Manual OAuth Provider Setup" section exists and the MCP_OAUTH_CLIENT_SECRET
  # / MCP_OAUTH_JWT_SIGNING_KEY / MCP_OAUTH_STORAGE_KEY keys have been added to
  # the `workout-logger-secret` Secret (see mcpOAuth.*SecretKey below). Flip to
  # "true" and fill in the values below once that setup is complete.
  MCP_OAUTH_ENABLED: "false"
  MCP_OAUTH_PROVIDER: auth0
  MCP_OAUTH_ISSUER: ""
  MCP_OAUTH_CLIENT_ID: ""
  MCP_OAUTH_AUDIENCE: "https://fitness.vvojtisek.eu/mcp/"
  MCP_OAUTH_ALLOWED_SUBJECTS: ""
  MCP_OAUTH_STORAGE_DIR: /data/mcp-oauth

# Names of the keys within `existingSecret` holding the corresponding MCP
# OAuth secrets, once created per the README's Secret Bootstrap step. Leave
# empty (or MCP_OAUTH_ENABLED: "false" above) until then.
mcpOAuth:
  clientSecretKey: ""
  jwtSigningKeySecretKey: ""
  storageKeySecretKey: ""

persistence:
  enabled: true
  size: 2Gi

backupPersistence:
  enabled: true
  size: 2Gi

# The host is small (2Gi RAM, no swap - see issue #72). None of these jobs are
# heavy (a single Alembic revision, a streamed SQLite online-backup copy, or a
# bind-only PVC mount), but left unbounded they can still stack with the app
# Deployment's own usage during a rollout and add to control-plane memory
# pressure. Capped well under the app's own limits.
backup:
  enabled: true
  schedule: "17 2 * * *"
  keep: 7
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

migrationJob:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

restore:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
