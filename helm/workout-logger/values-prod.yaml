---
replicaCount: 1

strategy:
  type: Recreate

image:
  repository: ghcr.io/vvojtisek/workout-logger
  tag: ""
  digest: "sha256:0ff721023bdb05e87b262bf3bcace503fbd52b96233922f8c1dbba4a606f4bfa"
  sourceCommit: "bc7e9aea0aeff169842c9c6237a67226ec113e58"
  pullPolicy: IfNotPresent

existingSecret: workout-logger-secret
apiKeySecretKey: API_KEY

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: fitness.vvojtisek.eu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: workout-logger-tls
      hosts:
        - fitness.vvojtisek.eu

env:
  APP_ENV: production
  APP_VERSION: "2.0.0"
  LOG_LEVEL: INFO
  TRUSTED_HOSTS: "localhost,127.0.0.1,fitness.vvojtisek.eu"
  PUBLIC_BASE_URL: "https://fitness.vvojtisek.eu/"
  RUN_MIGRATIONS_ON_STARTUP: "false"

persistence:
  enabled: true
  size: 2Gi

backupPersistence:
  enabled: true
  size: 2Gi

backup:
  enabled: true
  schedule: "17 2 * * *"
  keep: 7

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
