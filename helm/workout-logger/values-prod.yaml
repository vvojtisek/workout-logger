---
replicaCount: 1

strategy:
  type: Recreate

image:
  repository: ghcr.io/vvojtisek/workout-logger
  tag: ""
  digest: "sha256:6c4f99064b89ce8ef78515b107d553a773d6ed42e621c44debcc320d68021d1c"
  sourceCommit: "b942083adeefc1811a9e5b2760959332cab07192"
  pullPolicy: IfNotPresent

existingSecret: workout-logger-secret
apiKeySecretKey: API_KEY

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: fitness.vvojtisek.eu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: workout-logger-tls
      hosts:
        - fitness.vvojtisek.eu

env:
  APP_ENV: production
  APP_VERSION: "2.0.0"
  LOG_LEVEL: INFO
  TRUSTED_HOSTS: "localhost,127.0.0.1,fitness.vvojtisek.eu"
  PUBLIC_BASE_URL: "https://fitness.vvojtisek.eu/"
  RUN_MIGRATIONS_ON_STARTUP: "false"

persistence:
  enabled: true
  size: 2Gi

backupPersistence:
  enabled: true
  size: 2Gi

backup:
  enabled: true
  schedule: "17 2 * * *"
  keep: 7

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
