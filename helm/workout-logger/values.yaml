replicaCount: 1

strategy:
  type: Recreate

terminationGracePeriodSeconds: 60

lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 5"]

image:
  repository: workout-logger
  pullPolicy: IfNotPresent
  tag: "2.0.0"
  digest: ""
  sourceCommit: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: workout-logger.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  mountPath: /data
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  storageClass: ""

backupPersistence:
  enabled: true
  mountPath: /backups
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  storageClass: ""
  existingClaim: ""

backup:
  enabled: false
  schedule: "17 2 * * *"
  suspend: false
  keep: 7
  activeDeadlineSeconds: 600
  backoffLimit: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources: {}

restore:
  enabled: false
  backupFile: ""
  activeDeadlineSeconds: 600
  resources: {}

env:
  APP_ENV: production
  # Deployment metadata: CI (scripts/generate_build_info.py) overwrites these
  # in values-prod.yaml on every promotion -- see scripts/promote_image.py.
  # Never edit them by hand; they are the same source of truth baked into
  # the container image (see Dockerfile) and surfaced by /health, the
  # X-App-Version/X-Git-Commit/X-Build-Time headers, and the web UI.
  APP_VERSION: "2.0.0"
  GIT_COMMIT: "unknown"
  BUILD_TIME: "unknown"
  LOG_LEVEL: INFO
  TRUSTED_HOSTS: localhost,127.0.0.1
  PUBLIC_BASE_URL: "https://fitness.vvojtisek.eu/"
  RUN_MIGRATIONS_ON_STARTUP: "false"

existingSecret: workout-logger-secret
apiKeySecretKey: API_KEY

# Keys within `existingSecret` holding MCP OAuth secrets. Left empty (the
# default), no corresponding env var is rendered -- set these alongside
# MCP_OAUTH_ENABLED=true in `env` (see .env.example for what each controls).
# Never put the values themselves here or in values-prod.yaml.
mcpOAuth:
  clientSecretKey: ""
  jwtSigningKeySecretKey: ""
  storageKeySecretKey: ""

resources: {}

migrationJob:
  enabled: true
  command:
    - python
    - /app/scripts/run_migrations.py
  args:
    - head
  activeDeadlineSeconds: 300
  backoffLimit: 1
  resources: {}

startupProbe:
  httpGet:
    path: /health/startup
    port: http
  periodSeconds: 2
  timeoutSeconds: 2
  failureThreshold: 150

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2

nodeSelector: {}
tolerations: []
affinity: {}
