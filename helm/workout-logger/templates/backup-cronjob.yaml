{{- if .Values.backup.enabled }}
{{- if not .Values.persistence.enabled }}
{{- fail "backup.enabled=true requires persistence.enabled=true" }}
{{- end }}
{{- if not .Values.backupPersistence.enabled }}
{{- fail "backup.enabled=true requires backupPersistence.enabled=true" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "workout-logger.fullname" . }}-backup
  labels:
    {{- include "workout-logger.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  suspend: {{ .Values.backup.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds }}
      backoffLimit: {{ .Values.backup.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "workout-logger.maintenanceLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: backup
              image: {{ include "workout-logger.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              command: ["python", "/app/scripts/backup_database.py"]
              args:
                - --source
                - {{ printf "%s/workout_logger.db" .Values.persistence.mountPath | quote }}
                - --dest-dir
                - {{ .Values.backupPersistence.mountPath | quote }}
                - --keep
                - {{ .Values.backup.keep | quote }}
                - --source-release
                - {{ default .Chart.AppVersion .Values.image.sourceCommit | quote }}
                - --source-image
                - {{ include "workout-logger.image" . | quote }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: {{ .Values.persistence.mountPath }}
                - name: backups
                  mountPath: {{ .Values.backupPersistence.mountPath }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "workout-logger.fullname" . }}-data
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "workout-logger.backupClaimName" . }}
{{- end }}
