{{- if .Values.migrationJob.enabled }}
{{- $migrationIdentity := printf "%s|%s|%s" (include "workout-logger.image" .) (toJson .Values.migrationJob.command) (toJson .Values.migrationJob.args) }}
{{- $migrationNamePrefix := include "workout-logger.fullname" . | trunc 42 | trimSuffix "-" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $migrationNamePrefix }}-migrate-{{ sha256sum $migrationIdentity | trunc 12 }}
  labels:
    {{- include "workout-logger.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
spec:
  activeDeadlineSeconds: {{ .Values.migrationJob.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "workout-logger.migrationLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.image.digest }}
        workout-logger.vvojtisek.eu/image-digest: {{ . | quote }}
        {{- end }}
        {{- with .Values.image.sourceCommit }}
        workout-logger.vvojtisek.eu/source-commit: {{ . | quote }}
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "workout-logger.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "workout-logger.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            {{- toYaml .Values.migrationJob.command | nindent 12 }}
          args:
            {{- toYaml .Values.migrationJob.args | nindent 12 }}
          resources:
            {{- toYaml .Values.migrationJob.resources | nindent 12 }}
          env:
            - name: MIGRATION_RELEASE_ID
              value: {{ sha256sum $migrationIdentity | trunc 12 | quote }}
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: workout-logger-secret
                  key: API_KEY
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "workout-logger.fullname" . }}-data
        {{- end }}
{{- end }}
