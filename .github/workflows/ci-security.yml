name: Security scans

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'setup.cfg'
      - 'requirements*.txt'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    name: Dependency, secret, image, and SBOM scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e '.[dev]'
          pip-audit --strict .
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Audit frontend dependencies
        run: npm ci && npm audit --audit-level=high
      - name: Scan repository for secrets with gitleaks
        if: github.event_name != 'workflow_dispatch'
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan repository for secrets with gitleaks
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            detect --source=/repo --redact --verbose --log-opts=-1
      - name: Build image for security checks
        run: docker build --provenance=false --tag workout-logger:ci-scan .
      - name: Scan image for high and critical vulnerabilities with trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: workout-logger:ci-scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Generate syft software bill of materials
        uses: anchore/sbom-action@v0.24.0
        with:
          image: workout-logger:ci-scan
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Upload software bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials
          path: sbom.spdx.json
          retention-days: 14