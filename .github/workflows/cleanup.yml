name: Merged branch cleanup

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  delete-merged-pr-branch:
    name: Delete merged pull-request branch
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const defaultBranch = context.payload.repository.default_branch;
            if (branch === defaultBranch || branch.startsWith('release/')) {
              core.info(`Protected branch retained: ${branch}`);
              return;
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted merged branch: ${branch}`);
            } catch (error) {
              if (error.status === 422) {
                core.info(`Branch already deleted or protected: ${branch}`);
                return;
              }
              throw error;
            }
