name: Fast checks

# No path filter: these jobs are required status checks on main, and a workflow
# filtered out at the trigger never reports, leaving documentation-only pull
# requests permanently blocked.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Build the single-page application
        run: npm ci && npm run build
      - name: Check formatting
        run: ruff format --check .
      - name: Run Ruff
        run: ruff check --select E4,E7,E9,F .
      - name: Run mypy
        run: mypy app/
      - name: Run backend tests
        run: pytest

  frontend:
    name: Frontend quality and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Type-check frontend
        run: npm run typecheck
      - name: Run frontend unit tests
        run: npm test
      - name: Build frontend assets
        run: npm run build

  deployment:
    name: Deployment configuration validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate the production Compose file and the end-to-end overlay
        env:
          RELEASE_TAG: v0.0.0-ci
        run: |
          printf 'API_KEY=%s\n' "$(openssl rand -hex 32)" > deploy/aws/.env.production
          docker compose --env-file deploy/aws/.env.production \
            -f deploy/aws/compose.yaml config --quiet
          docker compose --env-file deploy/aws/.env.production \
            -f deploy/aws/compose.yaml -f e2e/compose.e2e.yaml config --quiet
      - name: Check deployment shell script syntax
        run: |
          bash -n scripts/deploy-aws-release.sh
          bash -n scripts/backup-aws-database.sh
          sh -n scripts/entrypoint.sh
