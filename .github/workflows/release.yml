name: Tagged release

# Runs for a vX.Y.Z tag pushed by hand, or is called by Continuous delivery
# with the next version and the main commit that passed Merge checks. In the
# called case the tag does not exist yet: it is created with the GitHub
# Release, only after the gates pass and the image is published.
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Release tag to create, vX.Y.Z
        required: true
        type: string
      sha:
        description: Commit on main that passed Merge checks
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_SHA: ${{ inputs.sha || github.sha }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Release quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Require a semantic version tag on main
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          # An existing tag must already point at this commit (the manual path).
          if tagged=$(git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}"); then
            [[ "$tagged" == "$RELEASE_SHA" ]] || {
              echo "$RELEASE_TAG already exists on $tagged, not $RELEASE_SHA" >&2
              exit 1
            }
          fi
      - name: Require a green end-to-end run on main for the tagged code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Merge checks skips documentation-only pushes, so check the newest
          # commit at or before the tag that changed anything it does not ignore.
          tested_sha=$(git log -1 --format=%H "$RELEASE_SHA" -- . \
            ':(exclude,glob)**/*.md' ':(exclude)docs' ':(exclude).github/PULL_REQUEST_TEMPLATE')
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci-merge.yml/runs?event=push&branch=main&head_sha=${tested_sha}&status=success" \
            --jq '.total_count')
          if [[ "$passed" -lt 1 ]]; then
            echo "No successful Merge checks run on main for ${tested_sha}; wait for it or fix main before tagging." >&2
            exit 1
          fi
          echo "Merge checks passed on main for ${tested_sha}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" pip-audit
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install, audit, and validate the frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Check Python formatting and lint
        run: |
          ruff format --check .
          ruff check --select E4,E7,E9,F .
      - name: Type-check backend
        run: mypy app/
      - name: Run backend tests
        run: pytest
      - name: Audit Python dependencies
        run: pip-audit --strict .

  publish:
    name: Publish image and downloadable GitHub release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture build time
        id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and publish multi-architecture image for EC2
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          build-args: |
            APP_VERSION=${{ env.RELEASE_TAG }}
            GIT_COMMIT=${{ env.RELEASE_SHA }}
            BUILD_TIME=${{ steps.build-time.outputs.value }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          push: true
          # A tag run can read caches written on main, but not those of earlier tags.
          cache-from: |
            type=gha,scope=workout-logger-release
            type=gha,scope=workout-logger
          cache-to: type=gha,scope=workout-logger-release,mode=max
      - name: Export the release image and deployment assets
        run: |
          mkdir -p release-assets
          for architecture in amd64 arm64; do
            docker pull --platform "linux/${architecture}" "$IMAGE:$RELEASE_TAG"
            docker save "$IMAGE:$RELEASE_TAG" | gzip --fast \
              > "release-assets/workout-logger-${RELEASE_TAG}-linux-${architecture}-image.tar.gz"
          done
          cp deploy/aws/compose.yaml "release-assets/workout-logger-${RELEASE_TAG}-compose.yaml"
          cp deploy/aws/.env.production.example "release-assets/workout-logger-${RELEASE_TAG}-env.example"
          cp deploy/aws/chem-app-Caddyfile.snippet "release-assets/workout-logger-${RELEASE_TAG}-caddy-snippet.txt"
          cp scripts/deploy-aws-release.sh "release-assets/deploy-workout-logger.sh"
          cp scripts/backup-aws-database.sh "release-assets/backup-workout-logger.sh"
          cp deploy/aws/workout-logger-backup.service release-assets/
          cp deploy/aws/workout-logger-backup.timer release-assets/
          chmod +x release-assets/deploy-workout-logger.sh
          chmod +x release-assets/backup-workout-logger.sh
          (cd release-assets && sha256sum ./* > "workout-logger-${RELEASE_TAG}-SHA256SUMS")
      - name: Write the changelog from Conventional Commits
        run: |
          python3 scripts/release_version.py notes \
            --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/release-notes.md"
      - name: Create the tag and the versioned GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag pushed by hand is verified; otherwise the release creates it
          # on the tested commit. Tags made with GITHUB_TOKEN start no workflow,
          # so this cannot trigger the push-tag path of this file again.
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            target=(--verify-tag)
          else
            target=(--target "$RELEASE_SHA")
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            "${target[@]}" \
            --title "Workout Logger ${RELEASE_TAG}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Point the latest image tag at the highest release
        run: |
          git fetch --force --tags origin
          python3 scripts/release_version.py is-latest --tag "$RELEASE_TAG" | tee latest.txt
          if grep -qx 'latest=true' latest.txt; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$RELEASE_TAG"
          fi

  # Called from Continuous delivery (ref main): deploy inside this run, so a
  # failed health check fails the release run too.
  deploy:
    name: Deploy to AWS
    needs: publish
    if: inputs.tag != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-aws.yml
    with:
      release_tag: ${{ inputs.tag }}

  # A tag pushed by hand runs on the tag ref; dispatch the deploy on main as
  # before, so the production environment sees the same ref either way.
  dispatch-deploy:
    name: Dispatch the AWS deployment
    needs: publish
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the guarded AWS deployment workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-aws.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --field "release_tag=$RELEASE_TAG"
