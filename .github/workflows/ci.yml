name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Check formatting
        run: ruff format --check .
      - name: Run Ruff
        run: ruff check --select E4,E7,E9,F .
      - name: Run mypy
        run: mypy app/
      - name: Run backend tests
        run: pytest

  frontend:
    name: Frontend quality and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Type-check frontend
        run: npm run typecheck
      - name: Run frontend unit tests
        run: npm test
      - name: Build frontend assets
        run: npm run build

  manifests:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output /tmp/kubeconform-linux-amd64.tar.gz
          curl --fail --location --silent --show-error \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/CHECKSUMS" \
            --output /tmp/kubeconform-checksums.txt
          (cd /tmp && grep ' kubeconform-linux-amd64.tar.gz$' kubeconform-checksums.txt \
            | sha256sum --check --strict)
          tar -xzf /tmp/kubeconform-linux-amd64.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Lint Helm chart
        run: helm lint helm/workout-logger
      - name: Render and validate default manifests
        run: |
          helm template workout-logger helm/workout-logger \
            | kubeconform -strict -summary -kubernetes-version 1.35.0
      - name: Render and validate production manifests
        run: |
          helm template workout-logger helm/workout-logger \
            --values helm/workout-logger/values-prod.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.35.0

  security:
    name: Dependency, secret, image, and SBOM scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e '.[dev]'
          pip-audit --strict .
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Audit frontend dependencies
        run: npm ci && npm audit --audit-level=high
      - name: Scan repository for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for security checks
        run: docker build --provenance=false --tag workout-logger:ci-scan .
      - name: Scan image for high and critical vulnerabilities with trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: workout-logger:ci-scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Generate syft software bill of materials
        uses: anchore/sbom-action@v0.24.0
        with:
          image: workout-logger:ci-scan
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Upload software bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials
          path: sbom.spdx.json

  e2e:
    name: Real Kubernetes end-to-end test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      E2E_NAMESPACE: workout-logger-e2e
      E2E_CLUSTER: workout-logger-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_IMAGE: workout-logger:e2e-${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend and browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Install k3d
        env:
          K3D_VERSION: v5.9.0
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64" \
            --output /tmp/k3d-linux-amd64
          curl --fail --location --silent --show-error \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/checksums.txt" \
            --output /tmp/k3d-checksums.txt
          (cd /tmp && grep ' _dist/k3d-linux-amd64$' k3d-checksums.txt \
            | sed 's#  _dist/#  #' | sha256sum --check --strict)
          chmod +x /tmp/k3d-linux-amd64
          sudo install /tmp/k3d-linux-amd64 /usr/local/bin/k3d
      - name: Build the exact application image
        run: docker build --provenance=false --tag "$E2E_IMAGE" .
      - name: Generate an ephemeral API credential
        run: echo "E2E_API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Create ephemeral Kubernetes cluster and deploy
        run: |
          mkdir -p artifacts
          k3d cluster create "$E2E_CLUSTER" --wait
          k3d image import "$E2E_IMAGE" --cluster "$E2E_CLUSTER"
          kubectl create namespace "$E2E_NAMESPACE"
          kubectl --namespace "$E2E_NAMESPACE" create secret generic workout-logger-secret \
            --from-literal="API_KEY=$E2E_API_KEY"
          helm template workout-logger helm/workout-logger \
            --namespace "$E2E_NAMESPACE" \
            --set image.repository=workout-logger \
            --set-string "image.tag=e2e-${GITHUB_SHA}" \
            --set image.pullPolicy=Never \
            --set backupPersistence.enabled=false \
            --set ingress.enabled=false \
            > artifacts/rendered.yaml
          kubectl --namespace "$E2E_NAMESPACE" apply -f artifacts/rendered.yaml
          migration_job=$(kubectl --namespace "$E2E_NAMESPACE" get jobs \
            --output=jsonpath='{.items[0].metadata.name}')
          test -n "$migration_job"
          kubectl --namespace "$E2E_NAMESPACE" wait \
            --for=condition=complete "job/$migration_job" \
            --timeout=300s
          kubectl --namespace "$E2E_NAMESPACE" rollout status deployment/workout-logger \
            --timeout=300s
      - name: Verify Alembic schema and exercise real API and browser UI
        run: |
          kubectl --namespace "$E2E_NAMESPACE" exec deployment/workout-logger -- \
            python -c "import sqlite3; print(sqlite3.connect('/data/workout_logger.db').execute('select version_num from alembic_version').fetchone()[0])"
          kubectl --namespace "$E2E_NAMESPACE" port-forward service/workout-logger 18000:8000 \
            > artifacts/port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health/ready >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "Application did not become reachable" >&2
              exit 1
            fi
            sleep 2
          done
          TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            E2E_BASE_URL=http://127.0.0.1:18000 \
            npm run test:e2e
      - name: Collect Kubernetes and browser diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          kubectl --namespace "$E2E_NAMESPACE" get all,pvc -o wide \
            > artifacts/resources.txt 2>&1 || true
          kubectl --namespace "$E2E_NAMESPACE" get events --sort-by=.lastTimestamp \
            > artifacts/events.txt 2>&1 || true
          for pod in $(kubectl --namespace "$E2E_NAMESPACE" get pods -o name 2>/dev/null); do
            safe_name=${pod#pod/}
            kubectl --namespace "$E2E_NAMESPACE" logs "$pod" --all-containers \
              > "artifacts/${safe_name}.log" 2>&1 || true
          done
      - name: Upload end-to-end diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            playwright-report/
          if-no-files-found: warn
      - name: Delete ephemeral Kubernetes cluster
        if: always()
        run: k3d cluster delete "$E2E_CLUSTER" || true

  publish:
    name: Publish immutable image and prepare promotion
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip image publish]')
    needs:
      - backend
      - frontend
      - manifests
      - security
      - e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an image previously published for this commit
        id: existing-image
        run: |
          if manifest=$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}' 2>/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$(jq -r .digest <<< "$manifest")" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract immutable Docker metadata
        if: steps.existing-image.outputs.exists != 'true'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ github.sha }}
      - name: Build and push container image
        if: steps.existing-image.outputs.exists != 'true'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Resolve published digest
        id: published-image
        env:
          EXISTING_DIGEST: ${{ steps.existing-image.outputs.digest }}
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid published digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE_REF as $digest"
      - name: Prepare production promotion
        env:
          IMAGE_DIGEST: ${{ steps.published-image.outputs.digest }}
        run: |
          python scripts/promote_image.py \
            --values helm/workout-logger/values-prod.yaml \
            --digest "$IMAGE_DIGEST" \
            --commit "$GITHUB_SHA"
      - name: Open production promotion pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.published-image.outputs.digest }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          promotion_branch="chore/promote-production-$short_sha"
          existing_pr=$(gh pr list --head "$promotion_branch" --state open --json url --jq '.[0].url // empty')
          if [[ -n "$existing_pr" ]]; then
            echo "Promotion pull request already exists: $existing_pr"
            exit 0
          fi
          if git diff --quiet -- helm/workout-logger/values-prod.yaml; then
            echo "Production already records $IMAGE_DIGEST for $GITHUB_SHA"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$promotion_branch" >/dev/null 2>&1; then
            echo "Promotion branch exists without an open pull request: $promotion_branch" >&2
            exit 1
          fi
          git switch -c "$promotion_branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- helm/workout-logger/values-prod.yaml
          git commit -m "chore(deploy): promote $short_sha [skip image publish]"
          git push --set-upstream origin "$promotion_branch"
          gh pr create \
            --base main \
            --head "$promotion_branch" \
            --draft \
            --title "chore(deploy): promote $short_sha [skip image publish]" \
            --body "Promote commit \`$GITHUB_SHA\` to production by immutable image digest \`$IMAGE_DIGEST\`.\n\nProduction changes only when this pull request is reviewed and merged."
