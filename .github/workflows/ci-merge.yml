name: Merge checks

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Production Compose end-to-end test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Same compose file, network name and image name the AWS host runs.
      COMPOSE_PROJECT_NAME: workout-logger-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_TAG: e2e-${{ github.sha }}
      E2E_ADMIN_EMAIL: e2e-admin@example.test
      E2E_ADMIN_PASSWORD: correct horse battery staple e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend and browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the exact application image
        run: docker build --provenance=false --tag "ghcr.io/vvojtisek/workout-logger:${RELEASE_TAG}" .
      - name: Generate an ephemeral API credential
        run: echo "E2E_API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Start the production Compose stack
        run: |
          mkdir -p artifacts
          printf 'API_KEY=%s\n' "$E2E_API_KEY" > deploy/aws/.env.production
          chmod 600 deploy/aws/.env.production
          sudo install -d -m 750 -o 10001 -g 10001 deploy/aws/data deploy/aws/backups
          docker network create chem-app_public-net
          docker compose --env-file deploy/aws/.env.production \
            -f deploy/aws/compose.yaml -f e2e/compose.e2e.yaml \
            up --detach --pull never --wait --wait-timeout 300
      - name: Verify Alembic schema and exercise real API and browser UI
        run: |
          compose=(docker compose --env-file deploy/aws/.env.production
            -f deploy/aws/compose.yaml -f e2e/compose.e2e.yaml)
          "${compose[@]}" exec -T workout-logger python -c \
            "import sqlite3; print(sqlite3.connect('/data/workout_logger.db').execute('select version_num from alembic_version').fetchone()[0])"
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:18000/health/ready
          "${compose[@]}" exec -T workout-logger python scripts/create_first_admin.py \
            --email "$E2E_ADMIN_EMAIL" \
            --password "$E2E_ADMIN_PASSWORD"
          TEST_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            E2E_BASE_URL=http://127.0.0.1:18000 \
            npm run test:e2e
          "${compose[@]}" exec -T workout-logger \
            python scripts/assert_empty_e2e_database.py /data/workout_logger.db
      - name: Collect container and browser diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          compose=(docker compose --env-file deploy/aws/.env.production
            -f deploy/aws/compose.yaml -f e2e/compose.e2e.yaml)
          "${compose[@]}" ps --all > artifacts/containers.txt 2>&1 || true
          "${compose[@]}" logs --no-color > artifacts/workout-logger.log 2>&1 || true
      - name: Upload end-to-end diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            artifacts/
            playwright-report/
          if-no-files-found: warn
      - name: Remove the end-to-end stack
        if: always()
        run: |
          docker compose --env-file deploy/aws/.env.production \
            -f deploy/aws/compose.yaml -f e2e/compose.e2e.yaml \
            down --volumes --remove-orphans || true
          docker network rm chem-app_public-net || true

  publish:
    name: Publish immutable image
    if: >-
      !contains(github.event.head_commit.message, '[skip image publish]')
    needs:
      - e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate deployment build metadata
        id: build-info
        run: python scripts/generate_build_info.py --format github >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an image previously published for this commit
        id: existing-image
        run: |
          if manifest=$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}' 2>/dev/null); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$(jq -r .digest <<< "$manifest")" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract immutable Docker metadata
        if: steps.existing-image.outputs.exists != 'true'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ github.sha }}
      - name: Build and push container image
        if: steps.existing-image.outputs.exists != 'true'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.build-info.outputs.APP_VERSION }}
            GIT_COMMIT=${{ steps.build-info.outputs.GIT_COMMIT }}
            BUILD_TIME=${{ steps.build-info.outputs.BUILD_TIME }}
      - name: Resolve published digest
        id: published-image
        env:
          EXISTING_DIGEST: ${{ steps.existing-image.outputs.digest }}
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid published digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE_REF as $digest"
